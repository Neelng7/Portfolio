<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Neel Gupta</title>
<!-- Suppresses the automatic /favicon.ico request, which would otherwise log a 404
     against every single scan. -->
<link rel="icon" href="data:,">

<!-- No-JavaScript fallback. It cannot record the scan or carry the serial through
     (a static refresh cannot read the query string), but the document still opens. -->
<noscript>
  <meta http-equiv="refresh" content="0; url=./documents/Neel_Gupta_Engineering_Portfolio.pdf">
</noscript>

<style>
  html, body { margin: 0; height: 100%; background: #1f2226; }
  main {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e8ebef;
  }
  a {
    color: #0b0e13;
    background: #5b8cff;
    padding: 14px 26px;
    border-radius: 8px;
    font-weight: 600;
    text-decoration: none;
  }
  p { margin: 0; color: #98a2b3; font-size: 14px; }
</style>
</head>
<body>

<main>
  <a id="directLink" href="./documents/Neel_Gupta_Engineering_Portfolio.pdf">Open the portfolio</a>
  <p id="note">Opening the portfolio&hellip;</p>
</main>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ settings */

  var PDF_PATH = './documents/Neel_Gupta_Engineering_Portfolio.pdf';

  // See apps-script/SETUP.md. Leave it empty and the page still works, just without
  // recording anything.
  var TRACKING_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyRa6sydpgMVG6TfjwlnDe-tN-jzo0W95-5Fod9tE_g0oXKdYN75IP1FeERDAoS4y7qyQ/exec';

  var QUEUE_KEY = 'qr-scan-queue';   // scans that could not be sent yet
  var QUEUE_MAX = 50;

  /* ------------------------------------------------------------- read the serial */

  var params = new URLSearchParams(window.location.search);
  var serial = params.get('sn');

  var visit = {
    serial: serial,
    openedAt: new Date().toISOString(),
    landingUrl: window.location.href,
    referrer: document.referrer || null,
    userAgent: navigator.userAgent,
    language: navigator.language,
    screen: window.screen ? window.screen.width + 'x' + window.screen.height : null
  };

  /* ------------------------------------------------------------------- sending */

  /**
   * Hand the record to the browser and return immediately.
   *
   * sendBeacon is the whole trick behind "record it but redirect instantly": the browser
   * takes ownership of the request and delivers it in the background, even after this
   * page is gone. Nothing here waits for a response, so a slow Apps Script — and it is
   * slow, often a second or more — costs the visitor exactly nothing.
   *
   * text/plain keeps it a "simple" request, so there is no CORS preflight to stall on.
   * The response is opaque and we do not care what it says.
   */
  function send(record) {
    if (!TRACKING_ENDPOINT) return false;

    // A beacon queued while the device is offline is simply dropped — sendBeacon reports
    // success the moment the browser accepts the payload, not when it is delivered, so
    // it cannot tell us about a failed send. Checking here is what makes "scanned in a
    // basement with no signal" actually recoverable: it goes to the local queue and
    // leaves on the next visit that has a connection.
    if (navigator.onLine === false) return false;

    var payload = JSON.stringify(record);
    try {
      var blob = new Blob([payload], { type: 'text/plain;charset=UTF-8' });
      if (navigator.sendBeacon && navigator.sendBeacon(TRACKING_ENDPOINT, blob)) return true;
    } catch (err) { /* fall through */ }
    try {
      // keepalive does the same job as a beacon for browsers without sendBeacon.
      fetch(TRACKING_ENDPOINT, {
        method: 'POST',
        body: payload,
        mode: 'no-cors',
        keepalive: true,
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' }
      });
      return true;
    } catch (err) {
      return false;
    }
  }

  function loadQueue() {
    try {
      var q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
      return Array.isArray(q) ? q : [];
    } catch (err) { return []; }
  }

  function saveQueue(q) {
    try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q.slice(-QUEUE_MAX))); }
    catch (err) { /* private mode or full — nothing useful to do */ }
  }

  /* ------------------------------------------------------------------ record it */

  // Anything stranded by an earlier offline scan goes out first.
  var queue = loadQueue();
  if (queue.length) {
    var stillStuck = [];
    for (var i = 0; i < queue.length; i++) {
      if (!send(queue[i])) stillStuck.push(queue[i]);
    }
    saveQueue(stillStuck);
    console.log('Retried ' + queue.length + ' queued scan(s); ' + stillStuck.length + ' still pending.');
  }

  if (serial) {
    console.log('%cSerial number: ' + serial,
                'font-size:15px;font-weight:700;color:#5b8cff');
    console.log('Scan record:', visit);
    if (!send(visit)) {
      // Offline, blocked, or no endpoint configured — keep it for the next visit.
      queue = loadQueue();
      queue.push(visit);
      saveQueue(queue);
      console.warn('Could not send now; queued for the next visit.');
    }
  } else {
    console.warn('No serial number in this URL. Expected something like ?sn=0001-K7M2 — not recording.');
  }

  /* --------------------------------------------------------------- go to the PDF */

  // Carry the serial onto the document request too, so it is visible anywhere that
  // logs requests.
  var target = PDF_PATH + (serial ? '?sn=' + encodeURIComponent(serial) : '');
  document.getElementById('directLink').setAttribute('href', target);

  // ?stay=1 holds the page so the console can be read while testing.
  if (params.get('stay') === '1') {
    document.getElementById('note').textContent =
      'Redirect paused (?stay=1). Use the button above to open the portfolio.';
    console.log('Redirect paused because ?stay=1 is set.');
    return;
  }

  // replace() rather than assign() so Back skips this hand-off page instead of
  // bouncing the visitor straight back into it.
  window.location.replace(target);
})();
</script>

</body>
</html>
