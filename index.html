<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Neel Gupta</title>
<link rel="icon" href="data:,">
<noscript>
  <meta http-equiv="refresh" content="0; url=https://www.linkedin.com/in/neelngupta/">
</noscript>
<style>
  html, body { margin: 0; height: 100%; background: #1f2226; }
  main {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e8ebef;
  }
  a {
    color: #0b0e13;
    background: #5b8cff;
    padding: 14px 26px;
    border-radius: 8px;
    font-weight: 600;
    text-decoration: none;
  }
  p { margin: 0; color: #98a2b3; font-size: 14px; }
</style>
</head>
<body>

<main>
  <a id="directLink" href="https://www.linkedin.com/in/neelngupta/">Open LinkedIn profile</a>
  <p id="note">Opening LinkedIn&hellip;</p>
</main>

<script>
(function () {
  'use strict';

  // The only thing recorded is the serial number printed alongside the QR code, plus the
  // time it was opened. Nothing about the visitor, their device or their location is
  // collected, stored or sent anywhere.

  var DESTINATION = 'https://www.linkedin.com/in/neelngupta/';
  var TRACKING_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzhu3BCbpetGaplv_w9ARNpiT-_QLkKSAuO3f28ENe13HHkZr6IOegi6e6X_vxQzlsaQA/exec';

  var params = new URLSearchParams(window.location.search);
  var serial = params.get('sn');

  if (serial && TRACKING_ENDPOINT) {
    try {
      navigator.sendBeacon(
        TRACKING_ENDPOINT,
        new Blob([JSON.stringify({ serial: serial })], { type: 'text/plain;charset=UTF-8' })
      );
    } catch (err) { /* never block the redirect */ }
  }
  console.log('Serial number:', serial || '(none in this URL)');

  if (params.get('stay') === '1') {
    document.getElementById('note').textContent = 'Redirect paused (?stay=1).';
    return;
  }
  window.location.replace(DESTINATION);
})();
</script>

</body>
</html>
