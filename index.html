<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Neel Gupta</title>
<!-- Suppresses the automatic /favicon.ico request, which would otherwise log a 404
     against every single scan and clutter the access log. -->
<link rel="icon" href="data:,">

<!-- No-JavaScript fallback. It cannot carry the serial through (a static refresh cannot
     read the query string), but the document still opens. -->
<noscript>
  <meta http-equiv="refresh" content="0; url=./documents/Neel_Gupta_Engineering_Portfolio.pdf">
</noscript>

<style>
  html, body { margin: 0; height: 100%; background: #1f2226; }
  main {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e8ebef;
  }
  a {
    color: #0b0e13;
    background: #5b8cff;
    padding: 14px 26px;
    border-radius: 8px;
    font-weight: 600;
    text-decoration: none;
  }
  p { margin: 0; color: #98a2b3; font-size: 14px; }
</style>
</head>
<body>

<main>
  <a id="directLink" href="./documents/Neel_Gupta_Engineering_Portfolio.pdf">Open the portfolio</a>
  <p id="note">Opening the portfolio&hellip;</p>
</main>

<script>
(function () {
  'use strict';

  var PDF_PATH = './documents/Neel_Gupta_Engineering_Portfolio.pdf';
  var STORE_KEY = 'qr-scans';
  var STORE_MAX = 50;

  // ---------------------------------------------------------------- read the serial

  var params = new URLSearchParams(window.location.search);
  var serial = params.get('sn');

  var visit = {
    serial: serial,
    scannedAt: new Date().toISOString(),
    landingUrl: window.location.href,
    referrer: document.referrer || null,
    userAgent: navigator.userAgent,
    language: navigator.language,
    screen: window.screen ? window.screen.width + 'x' + window.screen.height : null
  };

  /**
   * Record the scan, then hand off to the PDF.
   *
   * This page ALWAYS redirects — every device gets the browser's own PDF viewer, which is
   * the only thing that reliably shows the whole document. (An <iframe> renders as a
   * single cropped, unscrollable page on iOS Safari, and not at all on Android Chrome.)
   *
   * Everything therefore has to be recorded BEFORE the redirect, and has to survive it:
   *
   *   - console.log  — wiped by the navigation unless DevTools has "Preserve log" ticked.
   *                    Add ?stay=1 to the URL to stop the redirect and read it normally.
   *   - localStorage — survives. Read the last 50 scans back at any time with:
   *                        JSON.parse(localStorage.getItem('qr-scans'))
   *
   * To collect scans on a server, send them from here with sendBeacon — NOT a plain
   * fetch(), which the browser cancels when the page navigates away:
   *
   *   navigator.sendBeacon('https://your-api.example/scan', JSON.stringify(record));
   */
  function recordScan(record) {
    if (record.serial) {
      console.log('%cSerial number: ' + record.serial,
                  'font-size:15px;font-weight:700;color:#5b8cff');
    } else {
      console.warn('No serial number in this URL. Expected something like ?sn=0001-K7M2');
    }
    console.log('Scan record:', record);

    // Keep a local history so a scan is still inspectable after the redirect.
    try {
      var log = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
      if (!Array.isArray(log)) log = [];
      log.push(record);
      if (log.length > STORE_MAX) log = log.slice(-STORE_MAX);
      localStorage.setItem(STORE_KEY, JSON.stringify(log));
      console.log('Saved to localStorage["' + STORE_KEY + '"] — ' + log.length + ' scan(s) kept.');
    } catch (err) {
      // Private mode, or storage full/blocked. Not worth failing the redirect over.
      console.warn('Could not write the scan to localStorage:', err.message);
    }
  }

  recordScan(visit);

  // ---------------------------------------------------------------- go to the PDF

  // Carry the serial onto the document request too, so it also lands in server logs.
  var target = PDF_PATH + (serial ? '?sn=' + encodeURIComponent(serial) : '');
  document.getElementById('directLink').setAttribute('href', target);

  // ?stay=1 holds the page so the console can be read while testing.
  if (params.get('stay') === '1') {
    document.getElementById('note').textContent =
      'Redirect paused (?stay=1). Use the button above to open the portfolio.';
    console.log('Redirect paused because ?stay=1 is set.');
    return;
  }

  // replace() rather than assign() so Back skips this hand-off page instead of
  // bouncing the visitor straight back into it.
  window.location.replace(target);
})();
</script>

</body>
</html>
